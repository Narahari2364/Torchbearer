version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Server routes on Amplify only see env vars that are written into .env.production at build time.
        - env | grep -E '^(ELEVENLABS_|GEMINI_|S3_)' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
